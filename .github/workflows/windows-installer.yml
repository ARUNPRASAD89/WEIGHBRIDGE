name: Windows Installer (PyInstaller + Inno Setup)

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          if (Test-Path "pyinstaller.spec") {
            pyinstaller --noconfirm --clean pyinstaller.spec
          } elseif (Test-Path "src/main.py") {
            pyinstaller --noconfirm --clean --name Weighbridge src/main.py
          } else {
            echo "Please add pyinstaller.spec or src/main.py" ; exit 1
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          if ($ref -like "refs/tags/v*") { $v = $ref.Replace("refs/tags/v","") } else { $v = "1.0.0-ci.${{ github.run_number }}" }
          echo "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Ensure installer defaults exist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "installer\defaults" | Out-Null
          if (-not (Test-Path "installer\defaults\config.json")) {
            $config = @'
          {
            "App": { "Mode": "ManualMode", "Language": "en-US" },
            "Database": { "Provider": "SQLite", "ConnectionString": "Data Source=C:\\\ProgramData\\\\Weighbridge\\\\data\\\\weighbridge.db;Cache=Shared;Journal Mode=WAL" },
            "Hardware": { "Scale": { "Port": "COM3", "BaudRate": 9600, "Parity": "None", "DataBits": 8, "StopBits": 1, "Handshake": "None" } },
            "Logging": { "Level": "Information", "Directory": "C:\\\ProgramData\\\\Weighbridge\\\\logs" }
          }
          '@
            Set-Content -Path "installer\defaults\config.json" -Value $config
          }

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" }
          if (-not (Test-Path "installer\Weighbridge_Python.iss")) { echo "Missing installer\Weighbridge_Python.iss" ; exit 1 }
          & "$iscc" "/DAppVersion=$env:APP_VERSION" "installer\Weighbridge_Python.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ env.APP_VERSION }}
          path: |
            installer\dist\*.exe
            dist\Weighbridge\**

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer\dist\*.exe